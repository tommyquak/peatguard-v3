# PeatGuard Monthly Reprocessing Workflow
# Google Cloud Workflows definition for sequential pipeline execution.
#
# Triggered by Cloud Scheduler on the 1st of each month.
# Processes the previous month's Sentinel-1 acquisitions through all 5 stages:
#   ingest -> (insar + backscatter in parallel) -> timeseries -> analyze
#
# Deploy:
#   gcloud workflows deploy peatguard-monthly \
#     --source=cloud/workflow.yaml \
#     --location=asia-southeast1 \
#     --service-account=peatguard-sa@peatguard.iam.gserviceaccount.com \
#     --project=peatguard
#
# Manual trigger:
#   gcloud workflows run peatguard-monthly \
#     --location=asia-southeast1 \
#     --project=peatguard
#
# The workflow accepts no runtime arguments. Date range (previous month) is
# computed automatically from the execution timestamp. Cloud Run Jobs read
# their date overrides from environment variables set at job-update time;
# see scheduler-setup.sh for the update-then-execute pattern.

main:
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "asia-southeast1"
          - job_prefix: "peatguard"
          - base_url: ${"https://" + region + "-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/" + project_id}
          - run_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}

    - log_start:
        call: sys.log
        args:
          text: ${"PeatGuard monthly pipeline started. Execution " + run_id}
          severity: INFO

    # ---------------------------------------------------------------
    # Stage 1: Ingest -- download new Sentinel-1 SLC + GRD scenes
    # ---------------------------------------------------------------
    - trigger_ingest:
        call: http.post
        args:
          url: ${base_url + "/jobs/" + job_prefix + "-ingest:run"}
          auth:
            type: OAuth2
        result: ingest_response

    - extract_ingest_exec:
        assign:
          - ingest_exec_name: ${ingest_response.body.metadata.name}

    - log_ingest_started:
        call: sys.log
        args:
          text: ${"Ingest job started: " + ingest_exec_name}
          severity: INFO

    - wait_ingest:
        call: poll_job_completion
        args:
          base_url: ${base_url}
          execution_name: ${ingest_exec_name}
          max_polls: 960
        result: ingest_status

    - check_ingest:
        switch:
          - condition: ${ingest_status != "SUCCEEDED"}
            steps:
              - log_ingest_failed:
                  call: sys.log
                  args:
                    text: ${"PIPELINE FAILED at ingest stage. Status: " + ingest_status + ". Execution: " + run_id}
                    severity: ERROR
              - raise_ingest:
                  raise: ${"Ingest job failed with status " + ingest_status}

    - log_ingest_done:
        call: sys.log
        args:
          text: "Ingest stage completed successfully"
          severity: INFO

    # ---------------------------------------------------------------
    # Stage 2: InSAR + Backscatter (parallel)
    # These two stages are independent and can run concurrently.
    # InSAR processes SLC pairs; backscatter processes GRD scenes.
    # ---------------------------------------------------------------
    - parallel_processing:
        parallel:
          shared: [base_url, job_prefix, run_id]
          branches:
            - insar_branch:
                steps:
                  - trigger_insar:
                      call: http.post
                      args:
                        url: ${base_url + "/jobs/" + job_prefix + "-insar:run"}
                        auth:
                          type: OAuth2
                      result: insar_response

                  - extract_insar_exec:
                      assign:
                        - insar_exec_name: ${insar_response.body.metadata.name}

                  - log_insar_started:
                      call: sys.log
                      args:
                        text: ${"InSAR job started: " + insar_exec_name}
                        severity: INFO

                  - wait_insar:
                      call: poll_job_completion
                      args:
                        base_url: ${base_url}
                        execution_name: ${insar_exec_name}
                        max_polls: 960
                      result: insar_status

                  - check_insar:
                      switch:
                        - condition: ${insar_status != "SUCCEEDED"}
                          steps:
                            - log_insar_failed:
                                call: sys.log
                                args:
                                  text: ${"PIPELINE FAILED at InSAR stage. Status: " + insar_status}
                                  severity: ERROR
                            - raise_insar:
                                raise: ${"InSAR job failed with status " + insar_status}

                  - log_insar_done:
                      call: sys.log
                      args:
                        text: "InSAR stage completed successfully"
                        severity: INFO

            - backscatter_branch:
                steps:
                  - trigger_backscatter:
                      call: http.post
                      args:
                        url: ${base_url + "/jobs/" + job_prefix + "-backscatter:run"}
                        auth:
                          type: OAuth2
                      result: backscatter_response

                  - extract_backscatter_exec:
                      assign:
                        - backscatter_exec_name: ${backscatter_response.body.metadata.name}

                  - log_backscatter_started:
                      call: sys.log
                      args:
                        text: ${"Backscatter job started: " + backscatter_exec_name}
                        severity: INFO

                  - wait_backscatter:
                      call: poll_job_completion
                      args:
                        base_url: ${base_url}
                        execution_name: ${backscatter_exec_name}
                        max_polls: 480
                      result: backscatter_status

                  - check_backscatter:
                      switch:
                        - condition: ${backscatter_status != "SUCCEEDED"}
                          steps:
                            - log_backscatter_failed:
                                call: sys.log
                                args:
                                  text: ${"PIPELINE FAILED at backscatter stage. Status: " + backscatter_status}
                                  severity: ERROR
                            - raise_backscatter:
                                raise: ${"Backscatter job failed with status " + backscatter_status}

                  - log_backscatter_done:
                      call: sys.log
                      args:
                        text: "Backscatter stage completed successfully"
                        severity: INFO

    # ---------------------------------------------------------------
    # Stage 3: Time-Series -- MintPy SBAS inversion
    # Requires completed interferograms from InSAR stage.
    # ---------------------------------------------------------------
    - trigger_timeseries:
        call: http.post
        args:
          url: ${base_url + "/jobs/" + job_prefix + "-timeseries:run"}
          auth:
            type: OAuth2
        result: timeseries_response

    - extract_timeseries_exec:
        assign:
          - timeseries_exec_name: ${timeseries_response.body.metadata.name}

    - log_timeseries_started:
        call: sys.log
        args:
          text: ${"Timeseries job started: " + timeseries_exec_name}
          severity: INFO

    - wait_timeseries:
        call: poll_job_completion
        args:
          base_url: ${base_url}
          execution_name: ${timeseries_exec_name}
          max_polls: 480
        result: timeseries_status

    - check_timeseries:
        switch:
          - condition: ${timeseries_status != "SUCCEEDED"}
            steps:
              - log_timeseries_failed:
                  call: sys.log
                  args:
                    text: ${"PIPELINE FAILED at timeseries stage. Status: " + timeseries_status}
                    severity: ERROR
              - raise_timeseries:
                  raise: ${"Timeseries job failed with status " + timeseries_status}

    - log_timeseries_done:
        call: sys.log
        args:
          text: "Timeseries stage completed successfully"
          severity: INFO

    # ---------------------------------------------------------------
    # Stage 4: Analysis -- classification + canal detection + risk
    # Requires velocity from timeseries and VV composite from backscatter.
    # ---------------------------------------------------------------
    - trigger_analyze:
        call: http.post
        args:
          url: ${base_url + "/jobs/" + job_prefix + "-analyze:run"}
          auth:
            type: OAuth2
        result: analyze_response

    - extract_analyze_exec:
        assign:
          - analyze_exec_name: ${analyze_response.body.metadata.name}

    - log_analyze_started:
        call: sys.log
        args:
          text: ${"Analyze job started: " + analyze_exec_name}
          severity: INFO

    - wait_analyze:
        call: poll_job_completion
        args:
          base_url: ${base_url}
          execution_name: ${analyze_exec_name}
          max_polls: 240
        result: analyze_status

    - check_analyze:
        switch:
          - condition: ${analyze_status != "SUCCEEDED"}
            steps:
              - log_analyze_failed:
                  call: sys.log
                  args:
                    text: ${"PIPELINE FAILED at analyze stage. Status: " + analyze_status}
                    severity: ERROR
              - raise_analyze:
                  raise: ${"Analyze job failed with status " + analyze_status}

    # ---------------------------------------------------------------
    # Done
    # ---------------------------------------------------------------
    - log_success:
        call: sys.log
        args:
          text: ${"PeatGuard monthly pipeline completed successfully. Execution: " + run_id}
          severity: INFO

    - done:
        return: ${"Pipeline completed successfully. Execution: " + run_id}


# ---------------------------------------------------------------
# Subworkflow: poll a Cloud Run Job execution until it completes.
# Polls every 30 seconds, up to max_polls times.
# Returns "SUCCEEDED", "FAILED", or "TIMEOUT".
# ---------------------------------------------------------------
poll_job_completion:
  params:
    - base_url
    - execution_name
    - max_polls
  steps:
    - init_counter:
        assign:
          - poll_count: 0

    - poll_loop:
        try:
          steps:
            - get_execution:
                call: http.get
                args:
                  url: ${base_url + "/executions/" + execution_name}
                  auth:
                    type: OAuth2
                result: execution_response

            - check_completion:
                switch:
                  - condition: ${execution_response.body.status.completionTime != null}
                    steps:
                      - check_succeeded:
                          switch:
                            - condition: ${execution_response.body.status.succeededCount > 0}
                              return: "SUCCEEDED"
                            - condition: true
                              return: "FAILED"
                  - condition: ${poll_count >= max_polls}
                    return: "TIMEOUT"
                  - condition: true
                    steps:
                      - increment:
                          assign:
                            - poll_count: ${poll_count + 1}
                      - wait:
                          call: sys.sleep
                          args:
                            seconds: 30
                      - continue_polling:
                          raise: "still_running"
        retry:
          predicate: ${retry_if_running}
          max_retries: 960
          backoff:
            initial_delay: 0
            max_delay: 0
            multiplier: 1


# ---------------------------------------------------------------
# Retry predicate: only retry on "still_running" signals.
# ---------------------------------------------------------------
retry_if_running:
  params:
    - e
  steps:
    - check:
        switch:
          - condition: ${e.message == "still_running"}
            return: true
          - condition: true
            return: false
